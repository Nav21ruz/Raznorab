<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA redirect for GitHub Pages
      const path = window.location.pathname.replace('/raznorab', '')
      const search = window.location.search
      const hash = window.location.hash
      const url = '/?p=' + encodeURIComponent(path + search) + hash
      window.location.replace('/raznorab' + url)
    </script>
  </head>
  <body></body>
</html>
