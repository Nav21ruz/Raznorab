<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d131f" />
    <meta name="description" content="Биржа для стройки: заказчики, строители и разнорабочие находят друг друга" />
    <!-- запуск с домашнего экрана iOS без адресной строки -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Briggo" />
    <title>Briggo</title>
    <!--
      Настройки читаются до запуска приложения, чтобы их можно было менять
      прямо на хостинге, без пересборки. Должен идти раньше бандла.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <!--
      Внутри root лежит заглушка "Загрузка…". Когда приложение стартует, React
      затирает её собой. Если код не запустился — вместо чёрного экрана человек
      увидит понятное сообщение, а не пустоту.
    -->
    <div id="root">
      <div id="boot-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;color:#e5e7eb">
        <div style="text-align:center;max-width:520px">
          <div style="width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#b87333;display:flex;align-items:center;justify-content:center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>
            </svg>
          </div>
          <p id="boot-text" style="color:#6b7280;font-size:14px;margin:0">Загрузка…</p>
          <div id="boot-error" style="display:none;margin-top:16px;text-align:left;background:#1f2937;border:1px solid #374151;border-radius:12px;padding:16px">
            <p style="color:#f87171;font-weight:600;margin:0 0 8px;font-size:15px">Приложение не запустилось</p>
            <p style="color:#9ca3af;font-size:13px;line-height:1.6;margin:0 0 10px">
              Покажите этот текст разработчику — по нему сразу видно причину:
            </p>
            <pre id="boot-error-text" style="white-space:pre-wrap;word-break:break-word;color:#e5e7eb;font-size:12px;background:#111827;padding:10px;border-radius:8px;margin:0;font-family:ui-monospace,monospace"></pre>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Ловим ошибки запуска и показываем их на экране: без этого при любой
      // проблеме пользователь видит просто чёрную страницу и не понимает, что делать.
      // Дополнительно сами проверяем, что именно не так с файлом, — чтобы
      // не пришлось лезть в консоль браузера.
      (function () {
        var done = false
        function render(title, details) {
          if (done) return
          done = true
          var box = document.getElementById('boot-error')
          var text = document.getElementById('boot-error-text')
          var status = document.getElementById('boot-text')
          if (!box || !text) return
          if (status) status.style.display = 'none'
          box.style.display = 'block'
          text.textContent = title + (details ? '\n\n' + details : '')
        }

        // Определяем настоящую причину: файла нет или он отдаётся неверным типом
        function diagnose(url) {
          try {
            fetch(url, { cache: 'no-store' }).then(function (r) {
              var ct = (r.headers.get('content-type') || '(не указан)').split(';')[0]
              if (r.status === 404) {
                render('Файл не найден на сервере:\n' + url,
                  'Скорее всего, содержимое архива залито не в ту папку.\n' +
                  'Файл index.html должен лежать прямо в корневой папке сайта,\n' +
                  'рядом с ним — папка assets.')
              } else if (ct.indexOf('javascript') === -1) {
                render('Хостинг отдаёт файлы .js неправильным типом.',
                  'Файл: ' + url + '\n' +
                  'Сервер сообщает тип: ' + ct + '\n' +
                  'Требуется: application/javascript\n\n' +
                  'Браузер из соображений безопасности отказывается выполнять\n' +
                  'такой файл, поэтому страница остаётся пустой.\n\n' +
                  'Что делать: убедитесь, что вместе с сайтом залит файл .htaccess\n' +
                  '(он скрытый, имя начинается с точки — включите показ скрытых\n' +
                  'файлов в файловом менеджере). Именно он задаёт правильный тип.')
              } else {
                render('Файл загрузился, но не выполнился.',
                  'Файл: ' + url + '\nТип: ' + ct + ' (код ответа ' + r.status + ')')
              }
            }).catch(function (err) {
              render('Не удалось загрузить файл:\n' + url, String(err))
            })
          } catch (err) {
            render('Не удалось загрузить файл:\n' + url, String(err))
          }
        }

        window.addEventListener('error', function (e) {
          var el = e.target
          // Сбой загрузки файла (script/link/img): у события нет текста, но есть адрес
          if (el && el.tagName && (el.src || el.href)) {
            var url = el.src || el.href
            // Диагностируем только по основному скрипту — ошибки стилей вторичны
            if (el.tagName === 'SCRIPT' || /\.js($|\?)/.test(url)) diagnose(url)
            return
          }
          var msg = (e.error && e.error.stack) || e.message
          if (msg) render('Ошибка в коде приложения:', String(msg))
        }, true)

        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          render('Ошибка при запуске:', String((r && r.stack) || r))
        })

        // Если за 12 секунд приложение так и не отрисовалось — сообщаем об этом.
        setTimeout(function () {
          if (document.getElementById('boot-screen')) {
            render('Приложение не запустилось за 12 секунд.',
              'Проверьте, что вместе с сайтом залит скрытый файл .htaccess\n' +
              'и что index.html лежит в корневой папке сайта.')
          }
        }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
